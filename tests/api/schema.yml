  /api/sports-reservations/:
    get:
      operationId: sports_reservations_list
      description: Returns reservations from the current user club.
      summary: List sport object reservations
      tags:
      - Sports Reservations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportObjectReservation'
          description: ''
        '403':
          description: Reservation list is not available for child-linked profiles.
        '500':
          description: Internal server error.
    post:
      operationId: sports_reservations_create
      description: Creates a reservation in current user club. Optional send_confirmation_email
        flag controls notification sending.
      summary: Create sport object reservation
      tags:
      - Sports Reservations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sport_object:
                  type: integer
                  example: 1
                start_time:
                  type: string
                  format: date-time
                  example: '2026-07-07T10:00:00Z'
                end_time:
                  type: string
                  format: date-time
                  example: '2026-07-07T11:00:00Z'
                title:
                  type: string
                  example: Morning training reservation
                notes:
                  type: string
                  example: Optional details
                status:
                  type: string
                  example: booked
                send_confirmation_email:
                  type: boolean
                  example: true
              required:
              - sport_object
              - start_time
              - end_time
              additionalProperties: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportObjectReservation'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Reservation is forbidden for this profile or club.
        '500':
          description: Internal server error.
  /api/sports-reservations/{reservation_id}/:
    get:
      operationId: sports_reservations_retrieve
      description: Returns reservation details for current user club.
      summary: Get reservation details
      parameters:
      - in: path
        name: reservation_id
        schema:
          type: integer
        description: Reservation id.
        required: true
      tags:
      - Sports Reservations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportObjectReservation'
          description: ''
        '403':
          description: Reservation details are not available for child-linked profiles.
        '404':
          description: Reservation not found.
        '500':
          description: Internal server error.
    patch:
      operationId: sports_reservations_partial_update
      description: Updates reservation. If status is set to cancelled, linked training
        events are removed and reservation is deleted.
      summary: Update reservation
      parameters:
      - in: path
        name: reservation_id
        schema:
          type: integer
        description: Reservation id.
        required: true
      tags:
      - Sports Reservations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sport_object:
                  type: integer
                  example: 1
                start_time:
                  type: string
                  format: date-time
                  example: '2026-07-07T10:00:00Z'
                end_time:
                  type: string
                  format: date-time
                  example: '2026-07-07T11:00:00Z'
                title:
                  type: string
                  example: Updated reservation
                notes:
                  type: string
                  example: Updated notes
                status:
                  type: string
                  example: cancelled
                send_cancellation_email:
                  type: boolean
                  example: true
              additionalProperties: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Reservation updated or cancelled/deleted successfully.
        '400':
          description: Validation error.
        '403':
          description: Sport object does not belong to your club.
        '404':
          description: Reservation not found.
        '500':
          description: Internal server error.
    delete:
      operationId: sports_reservations_destroy
      description: Deletes reservation, sends cancellation email, and removes linked
        training events.
      summary: Delete reservation
      parameters:
      - in: path
        name: reservation_id
        schema:
          type: integer
        description: Reservation id.
        required: true
      tags:
      - Sports Reservations
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Reservation and linked training events deleted.
        '404':
          description: Reservation not found.
        '500':
          description: Internal server error.
