        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '400':
          description: Validation error.
  /api/club/members/delete/{member_id}/:
    delete:
      operationId: club_members_delete_destroy
      summary: Delete member
      parameters:
      - in: path
        name: member_id
        schema:
