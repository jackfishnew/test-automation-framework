openapi: 3.0.3
info:
  title: Klubster API
  version: 1.0.0
  description: Backend REST API for Klubster project
paths:
  /api/aktualnosci/threads/:
    get:
      operationId: aktualnosci_threads_list
      summary: List threads
      tags:
      - News
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AktualnosciThread'
          description: ''
        '403':
          description: Missing permissions.
    post:
      operationId: aktualnosci_threads_create
      summary: Create thread
      tags:
      - News
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AktualnosciThreadUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AktualnosciThreadUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AktualnosciThreadUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AktualnosciThread'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Missing permissions.
  /api/aktualnosci/threads/{thread_id}/:
    patch:
      operationId: aktualnosci_threads_partial_update
      summary: Update thread
      parameters:
      - in: path
        name: thread_id
        schema:
          type: integer
        required: true
      tags:
      - News
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAktualnosciThreadUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAktualnosciThreadUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAktualnosciThreadUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AktualnosciThread'
          description: ''
        '404':
          description: Thread not found.
        '403':
          description: Missing permissions.
  /api/aktualnosci/threads/{thread_id}/comments/:
    post:
      operationId: aktualnosci_threads_comments_create
      summary: Add thread comment
      parameters:
      - in: path
        name: thread_id
        schema:
          type: integer
        required: true
      tags:
      - News
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AktualnosciCommentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AktualnosciCommentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AktualnosciCommentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AktualnosciComment'
          description: ''
        '404':
          description: Thread not found.
        '403':
          description: Missing permissions.
  /api/club-calendar/events/:
    get:
      operationId: club_calendar_events_list
      summary: List club calendar events
      tags:
      - Club Calendar
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
