  /api/club/profile/update/:
    get:
      operationId: club_profile_update_retrieve
      summary: Get club profile
      tags:
      - Club
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubProfile'
          description: ''
    patch:
      operationId: club_profile_update_partial_update
      summary: Update club profile
      tags:
      - Club
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClubProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClubProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
