  /api/payments-management/training-payments/mark-paid/:
    post:
      operationId: payments_management_training_payments_mark_paid_create
      summary: Mark payment as paid
      tags:
      - Payments Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                child_id:
                  type: integer
                  example: 10
                group_id:
                  type: integer
                  example: 5
                month:
                  type: string
                  example: 2026-07
                  description: YYYY-MM
              required:
              - child_id
              - month
              additionalProperties: false
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Payment marked as paid.
        '400':
          description: Validation error.
        '403':
          description: Missing permissions.
        '404':
          description: Child not found.
        '500':
          description: Internal server error.
  /api/schema/:
