          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DraftEmailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Draft saved.
        '400':
          description: Validation error.
    patch:
      operationId: emails_draft_partial_update
      summary: Update draft
      tags:
      - Emails
      requestBody:
