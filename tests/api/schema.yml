      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubProfile'
          description: ''
    patch:
      operationId: club_profile_partial_update
      summary: Update club profile
      tags:
