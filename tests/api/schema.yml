          description: ''
        '403':
          description: Missing permissions.
        '500':
          description: Internal server error.
    post:
      operationId: club_calendar_events_create
      summary: Create club calendar event
      tags:
      - Club Calendar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubCalendarEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClubCalendarEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClubCalendarEventRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubCalendarEvent'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Missing permissions.
        '500':
          description: Internal server error.
  /api/club-calendar/events/{event_id}/:
    patch:
      operationId: club_calendar_events_partial_update
      summary: Update club calendar event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - Club Calendar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClubCalendarEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClubCalendarEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClubCalendarEventRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubCalendarEvent'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Missing permissions.
        '404':
          description: Event not found.
        '500':
          description: Internal server error.
    delete:
      operationId: club_calendar_events_destroy
      summary: Delete club calendar event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - Club Calendar
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Event deleted.
        '403':
          description: Missing permissions.
        '404':
          description: Event not found.
        '500':
          description: Internal server error.
