      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: admin.club@test.local
                password:
                  type: string
                  example: test_password
                accept_terms:
                  type: boolean
                  example: true
                accept_privacy_policy:
                  type: boolean
                  example: true
                abonament:
                  type: string
                  example: basic
              required:
              - email
              - password
              - accept_terms
              - accept_privacy_policy
      security:
      - jwtAuth: []
