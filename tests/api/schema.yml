      security:
      - jwtAuth: []
      responses:
        '200':
          description: Draft updated.
        '400':
          description: Validation error.
    delete:
      operationId: emails_draft_destroy_2
      summary: Delete draft
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Emails
      security:
      - jwtAuth: []
