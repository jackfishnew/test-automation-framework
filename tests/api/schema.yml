  /api/emails/{id}/:
    get:
      operationId: emails_retrieve
      summary: Get email thread detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Emails
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
          description: ''
        '404':
          description: Message not found.
  /api/emails/{id}/status/:
    post:
      operationId: emails_status_create
      summary: Change message status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Emails
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - mark_as_read
                  - mark_as_unread
                  - star
                  - unstar
                  - delete
                  - restore
                  - mark_as_draft
                  - mark_as_sent
                  - archive
                  - unarchive
                  example: mark_as_read
              required:
              - action
              additionalProperties: false
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Status changed.
        '400':
          description: Invalid action.
  /api/emails/create:
    post:
      operationId: emails_create_create
      summary: Send email
      tags:
      - Emails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Email sent successfully.
        '400':
          description: Validation error.
  /api/emails/deleted:
    get:
      operationId: emails_deleted_list
      summary: Get deleted messages
      tags:
      - Emails
      security:
      - jwtAuth: []
      responses:
        '200':
