          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDraftEmailRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Draft updated.
        '400':
          description: Validation error.
    delete:
      operationId: emails_draft_destroy
      summary: Delete draft
      tags:
      - Emails
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Draft deleted.
  /api/emails/draft/{id}/:
    post:
      operationId: emails_draft_create_2
      summary: Create draft
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Emails
      requestBody:
        content:
