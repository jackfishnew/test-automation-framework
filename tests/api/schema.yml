      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: admin.club@test.local
              required:
              - email
              additionalProperties: false
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Generic success message to prevent account enumeration.
        '400':
          description: Email is missing in request body.
  /api/user_management/token/:
    post:
      operationId: user_management_token_create
      description: Authenticate user and return JWT access and refresh tokens.
      summary: Obtain JWT token pair
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
              - username
              - password
              additionalProperties: false
            examples:
              ValidLogin:
                value:
                  username: admin.club@test.local
                  password: test_password
                summary: Valid Login
              InvalidPassword:
                value:
                  username: admin.club@test.local
                  password: wrong_password
                summary: Invalid Password
              MissingParameters:
                value:
                  username: admin.club@test.local
                summary: Missing parameters
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh:
                    type: string
                    example: refresh_token
                  access:
                    type: string
                    example: access_token
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: No active account found with the given credentials
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Internal server error.
                description: Internal server error.
          description: ''
  /api/user_management/token/refresh/:
    post:
      operationId: user_management_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - user_management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
