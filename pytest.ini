[pytest]
testpaths = tests
addopts = -ra --alluredir=./tests/allure-results --clean-alluredir
pythonpath = tests
markers =
    contract: api schema check contract 
    api: API-layer tests
    ui: browser/UI tests
    load: Marks tests as load/performance tests
    smoke: quick critical path   
    slow: long-running tests
    intern: Intern no target relevant test

# Custom CLI options (documented from tests/conftest.py)
# --api-base-url: Base URL for API tests (overrides TEST_API_BASE_URL)
# --api-admin-username: Admin username for API tests (overrides TEST_API_ADMIN_USERNAME)
# --api-admin-password: Admin password for API tests (overrides TEST_API_ADMIN_PASSWORD)
# --ui-browser: Browser for UI tests (chrome|firefox), overrides UI_BROWSER env
# --ui-headless: Run UI tests headless (true|false), overrides UI_HEADLESS env
# --ui-base-url: Base URL for UI tests (overrides TEST_UI_BASE_URL)
# --api-mailpit-host: Mailpit host for API tests (overrides MAILPIT_HOST)
# --mobile: Run tests for mobile devices (true|false)
